# ── Сервер ────────────────────────────────────────────────────────────────
server.port=8080

# ── База данных H2 (встроенная, не требует установки) ─────────────────────
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update — автоматически создаёт/обновляет таблицы по entity-классам
spring.jpa.hibernate.ddl-auto=update
# Показывать SQL-запросы в консоли (удобно при разработке)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 консоль (браузерный интерфейс для просмотра БД) ───────────────────
# Открывается по адресу: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── CORS — разрешаем запросы с React (порт 3000) ─────────────────────────
# Настраивается в CorsConfig.kt, эта строка для справки
app.cors.allowed-origins=http://localhost:3000
